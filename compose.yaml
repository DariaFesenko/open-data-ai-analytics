services:
  data_load:
    build: ./data_load
    container_name: data_load
    environment:
      CSV_PATH: /data/dataset.csv
      DB_PATH: /storage/data.db
      TABLE_NAME: contracts
    volumes:
      - ./data:/data:ro
      - storage:/storage
    networks:
      - app_net
    restart: "no"

  data_quality_analysis:
    build: ./data_quality_analysis
    container_name: data_quality_analysis
    environment:
      DB_PATH: /storage/data.db
      TABLE_NAME: contracts
      REPORTS_DIR: /reports
    volumes:
      - storage:/storage:ro
      - reports:/reports
    depends_on:
      - data_load
    networks:
      - app_net
    restart: "no"

  data_research:
    build: ./data_research
    container_name: data_research
    environment:
      DB_PATH: /storage/data.db
      TABLE_NAME: contracts
      REPORTS_DIR: /reports
    volumes:
      - storage:/storage:ro
      - reports:/reports
    depends_on:
      - data_load
    networks:
      - app_net
    restart: "no"

  visualization:
    build: ./visualization
    container_name: visualization
    environment:
      DB_PATH: /storage/data.db
      TABLE_NAME: contracts
      PLOTS_DIR: /plots
    volumes:
      - storage:/storage:ro
      - plots:/plots
    depends_on:
      - data_load
    networks:
      - app_net
    restart: "no"

  web:
    build: ./web
    container_name: web
    environment:
      REPORTS_DIR: /reports
      PLOTS_DIR: /plots
    volumes:
      - reports:/reports:ro
      - plots:/plots:ro
    ports:
      - "5000:5000"
    depends_on:
      - data_quality_analysis
      - data_research
      - visualization
    networks:
      - app_net
    restart: unless-stopped

volumes:
  storage:
  reports:
  plots:

networks:
  app_net:
    driver: bridge